<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FLYGRU.COM.BR | Domínio à venda</title>
  <meta name="description" content="O domínio FLYGRU.COM.BR está disponível para venda. Entre em contato para fazer uma proposta.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #071b2e;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: rgba(44, 178, 255, 0.12);
      top: -200px;
      right: -150px;
    }

    body::after {
      content: "";
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: rgba(44, 178, 255, 0.07);
      bottom: -220px;
      left: -100px;
    }

    .container {
      width: 90%;
      max-width: 900px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .tag {
      display: inline-block;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 50px;
      padding: 9px 18px;
      margin-bottom: 35px;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #9edcff;
    }

    h1 {
      font-size: clamp(44px, 9vw, 92px);
      letter-spacing: -3px;
      margin-bottom: 18px;
    }

    .highlight {
      color: #38bdf8;
    }

    h2 {
      font-size: clamp(22px, 4vw, 36px);
      font-weight: 400;
      margin-bottom: 25px;
    }

    p {
      max-width: 650px;
      margin: 0 auto 38px;
      color: #b8c6d3;
      font-size: 17px;
      line-height: 1.7;
    }

    .button {
      display: inline-block;
      padding: 17px 32px;
      background: #38bdf8;
      color: #071b2e;
      text-decoration: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      transition: 0.25s;
    }

    .button:hover {
      transform: translateY(-3px);
      background: #7dd3fc;
    }

    .footer {
      margin-top: 55px;
      color: #71869a;
      font-size: 12px;
      letter-spacing: 1px;
    }

    .plane {
      font-size: 30px;
      margin-bottom: 18px;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="plane">✈</div>

    <div class="tag">Domínio disponível</div>

    <h1>FLY<span class="highlight">GRU</span></h1>

    <h2>Este domínio está à venda.</h2>

    <p>
      Um endereço curto, memorável e estratégico para projetos ligados
      a Guarulhos, viagens, turismo, mobilidade, aviação e serviços.
      Uma oportunidade para construir uma marca forte no ambiente digital.
    </p>

    <a class="button"
       href="mailto:vanda@vanda.com.br?subject=Interesse%20no%20dom%C3%ADnio%20FLYGRU.COM.BR">
      TENHO INTERESSE NESTE DOMÍNIO
    </a>

    <div class="footer">
      FLYGRU.COM.BR
    </div>

  </main>

</body>
</html>
